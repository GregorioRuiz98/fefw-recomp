name: Public source audit
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, pinned
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the public package and history guards
        run: python3 -m unittest discover -s project/tests -p 'test_public*.py' -v
      - name: Audit staged sources and reachable history
        run: python3 project/tools/audit_public_repo.py --repo . --history
